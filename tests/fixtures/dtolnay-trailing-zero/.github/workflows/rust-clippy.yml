# Minimized from zino-rs/zino .github/workflows/rust-clippy.yml
on: [push]
jobs:
  rust-clippy-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.90
          components: clippy
      - run: cargo clippy
