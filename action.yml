name: rust1100-check
description: Find where your CI YAML, scripts and Cargo dependencies break on Rust 1.100
branding:
  icon: alert-triangle
  color: orange

inputs:
  path:
    description: Repository root to scan
    required: false
    default: "."
  min-publish-age:
    description: Preview Cargo's cooldown with this age, e.g. "7 days". Empty to skip
    required: false
    default: ""
  fail-on:
    description: Lowest severity that fails the step (error, warning, note, never)
    required: false
    default: "error"
  version:
    description: Release of rust1100-check to use
    required: false
    default: "0.1.0"

runs:
  using: composite
  steps:
    - name: Install rust1100-check ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          *) target="" ;;
        esac
        bin="$RUNNER_TEMP/rust1100-check-bin"
        mkdir -p "$bin"
        url="https://github.com/majiayu000/rust1100-check/releases/download/v$VERSION/cargo-rust1100-check-$target.tar.gz"
        if [ -n "$target" ] && curl -fsSL "$url" | tar -xz -C "$bin"; then
          echo "$bin" >> "$GITHUB_PATH"
        else
          echo "no prebuilt binary for $RUNNER_OS-$RUNNER_ARCH, building from source"
          cargo install --git https://github.com/majiayu000/rust1100-check --tag "v$VERSION" --locked
        fi
    - name: Run rust1100-check
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        MIN_PUBLISH_AGE: ${{ inputs.min-publish-age }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=("$SCAN_PATH" --format github --fail-on "$FAIL_ON")
        if [ -n "$MIN_PUBLISH_AGE" ]; then args+=(--min-publish-age "$MIN_PUBLISH_AGE"); fi
        cargo-rust1100-check "${args[@]}"
