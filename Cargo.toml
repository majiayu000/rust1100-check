[package]
name = "rust1100-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Check a Rust repo's CI YAML, rust-toolchain inputs, MSRV scripts and Cargo.lock for Rust 1.100 breakage: unquoted 1.100 read as 1.1, string version compares, new beta lints, and a Cargo min-publish-age cooldown preview"
license = "MIT"
repository = "https://github.com/majiayu000/rust1100-check"
readme = "README.md"
keywords = ["rust-1100", "msrv", "ci", "github-actions", "cooldown"]
categories = ["development-tools::cargo-plugins", "command-line-utilities", "development-tools"]
exclude = ["examples/real-repos/", "docs/social-preview.png"]

[[bin]]
name = "cargo-rust1100-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
jiff = "0.2"
regex = "1.13"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = "3.5"
yaml-rust2 = "0.13"
