[package]
name = "rust1100-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find where your CI, scripts and dependencies break on Rust 1.100, and preview Cargo's min-publish-age cooldown"
license = "MIT OR Apache-2.0"
repository = "https://github.com/majiayu000/rust1100-check"
keywords = ["cargo", "ci", "msrv", "yaml", "lint"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[[bin]]
name = "cargo-rust1100-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
jiff = "0.2"
regex = "1.13"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = "3.5"
yaml-rust2 = "0.13"
